id: wrong_number
title: "The Wrong Number"
domain: data_engineering
seed: 20260101
briefing: >
  A university analytics dashboard reports student enrollment statistics
  that don't match between departments. The Registrar's office, the
  Dean's office, and the public-facing dashboard all show different total
  enrollment numbers for the current term, and nobody agrees on which one
  is right. Determine what is happening.

difficulty:
  technical_depth: 0.55
  information_sparsity: 0.5
  contradiction: 0.35
  false_leads: 2
  agent_count: 4
  evidence_noise: 0.15
  event_complexity: 0.35
  experiment_cost: 0.2
  solution_complexity: 0.55
  adversarial_pressure: 0.1
  dynamicity: 0.25

ground_truth:
  root_cause_id: stale_materialized_view_plus_duplicate_transfer_records
  root_cause_summary: >
    Two independent issues compound each other. First, the public dashboard
    reads from a materialized view that is only refreshed once nightly, so
    it lags same-day enrollment changes by up to 24 hours -- explaining why
    it disagrees with the Registrar's live numbers. Second, and more
    subtly, students who transfer between departments mid-term are
    represented by two rows in the underlying enrollment table (an old
    department-assignment row that was never marked inactive, plus a new
    one), because the transfer workflow inserts a new record without
    properly closing out the old one. The Dean's office report double-
    counts these transferred students, inflating its total above both the
    Registrar's and the dashboard's numbers.
  mechanism: >
    (1) Materialized view refreshed on a nightly batch schedule rather than
    on write, causing dashboard staleness relative to the live Registrar
    system. (2) A student-transfer workflow bug: transferring a student's
    department creates a new enrollment row but fails to set an end-date /
    inactive flag on the prior row, so simple SUM/COUNT queries without an
    "is_active" filter double-count transferred students.
  hidden_state:
    view_refresh_schedule: "nightly at 02:00"
    duplicate_row_cause: "transfer workflow missing row-closure step"
    affected_student_count_estimate: 37

facts:
  - id: fact_public_symptom
    text: "The Registrar's portal, the Dean's office report, and the public dashboard all show different total enrollment numbers this term."
    classification: green
    tags: [symptom]

  - id: fact_public_registrar_lowest
    text: "The Registrar's number is generally the lowest of the three, and is described as the most 'live' or up-to-date source."
    classification: green
    tags: [symptom]

  - id: fact_registrar_source_of_truth_claim
    text: "As far as we're concerned, our system is the source of truth -- we update it the moment a student's enrollment or department changes."
    classification: yellow
    tags: [architecture]

  - id: fact_registrar_no_recent_bugs
    text: "We haven't shipped any changes to our own enrollment system recently, so if something's wrong, it's probably downstream of us."
    classification: yellow
    tags: [false_lead_elimination]

  - id: fact_dashboard_dev_materialized_view
    text: "The public dashboard doesn't query the Registrar's database directly -- it reads from a materialized view that gets refreshed on a nightly schedule for performance reasons."
    classification: yellow
    tags: [architecture, root_cause]

  - id: fact_dashboard_dev_refresh_time
    text: "That refresh job runs once a night, around 2am, so any enrollment changes made during the day won't show up on the dashboard until the next day."
    classification: yellow
    tags: [root_cause]

  - id: fact_dashboard_dev_false_lead_cache
    text: "We did check the CDN and browser caching in front of the dashboard, and cache headers look correctly configured -- that's not adding extra staleness on top."
    classification: yellow
    tags: [false_lead]

  - id: fact_deans_office_report_method
    text: "Our office report is generated by summing up department headcounts from an export we pull each week."
    classification: yellow
    tags: [process]

  - id: fact_deans_office_higher_than_expected
    text: "Our total consistently comes out higher than both the Registrar's number and the dashboard's number, which is the part that really confuses us."
    classification: yellow
    tags: [symptom, contradiction]

  - id: fact_data_engineer_transfer_workflow
    text: "When a student transfers departments, our system inserts a new enrollment row for the new department -- I'd have to check whether the old row is properly closed out."
    classification: yellow
    tags: [root_cause_adjacent]

  - id: fact_data_engineer_duplicate_confirmed
    text: "I checked, and confirmed it: the transfer workflow doesn't set an end-date on the old department row, so a transferred student ends up with two active-looking enrollment rows instead of one."
    classification: yellow
    tags: [root_cause]

  - id: fact_data_engineer_query_without_filter
    text: "The Dean's office export query does a simple count of enrollment rows without filtering for an 'is_active' flag, so it would count both the old and new row for any transferred student."
    classification: yellow
    tags: [root_cause]

  - id: fact_data_engineer_false_lead_timezone
    text: "We looked at whether a timezone handling bug in date filtering could explain some of the discrepancy, but the numbers don't line up with that theory -- it's not timezone-related."
    classification: yellow
    tags: [false_lead]

  - id: fact_red_exact_duplicate_count
    text: "Approximately 37 students who transferred departments this term have duplicate active enrollment rows due to the transfer workflow bug."
    classification: red
    tags: [ground_truth]

  - id: fact_red_root_cause_statement
    text: "Root cause: dashboard staleness from nightly materialized view refresh, compounded by a transfer-workflow bug that leaves duplicate active enrollment rows for transferred students, inflating department-level counts that don't filter by is_active."
    classification: red
    tags: [ground_truth]

timeline:
  - id: evt_transfer_bug_introduced
    at_seconds: -7776000
    description: "~3 months ago - Transfer workflow deployed without a row-closure step (root cause of duplicates)."
    classification: yellow
    hidden_until_discovered: true

  - id: evt_view_refresh_last_night
    at_seconds: -28800
    description: "Last night, 02:00 - Materialized view refresh job ran, capturing yesterday's data."
    classification: yellow
    hidden_until_discovered: true

  - id: evt_discrepancy_noticed
    at_seconds: 0
    description: "This morning - Departments compare notes and notice the enrollment numbers don't match."
    classification: green

agents:
  - id: registrar_staff
    role: "Registrar Staff"
    display_name: "Ingrid (Registrar Staff)"
    personality: >
      Confident in her own system's accuracy, a bit quick to point
      elsewhere, describes the live enrollment process clearly when asked.
    provider: gemini
    knowledge_ids:
      - fact_registrar_source_of_truth_claim
      - fact_registrar_no_recent_bugs
    conditional_knowledge_ids: {}

  - id: dashboard_developer
    role: "Dashboard Developer"
    display_name: "Kwame (Dashboard Developer)"
    personality: >
      Technical, explains the dashboard's data pipeline willingly, mentions
      the nightly refresh readily when asked how the dashboard gets its
      data.
    provider: groq
    knowledge_ids:
      - fact_dashboard_dev_materialized_view
      - fact_dashboard_dev_refresh_time
      - fact_dashboard_dev_false_lead_cache
    conditional_knowledge_ids: {}

  - id: deans_office_staff
    role: "Dean's Office Staff"
    display_name: "Beatrice (Dean's Office Staff)"
    personality: >
      Puzzled and slightly worried the report looks wrong to leadership,
      explains their own process honestly but doesn't understand the
      underlying database structure.
    provider: gemini
    knowledge_ids:
      - fact_deans_office_report_method
      - fact_deans_office_higher_than_expected
    conditional_knowledge_ids: {}

  - id: data_engineer
    role: "Data Engineer"
    display_name: "Sofia (Data Engineer)"
    personality: >
      Curious and thorough, will investigate out loud, connects the
      transfer-workflow issue to the Dean's office over-count once both
      pieces are on the table.
    provider: groq
    knowledge_ids:
      - fact_data_engineer_false_lead_timezone
    conditional_knowledge_ids:
      fact_data_engineer_transfer_workflow:
        - fact_deans_office_higher_than_expected
      fact_data_engineer_duplicate_confirmed:
        - fact_data_engineer_transfer_workflow
      fact_data_engineer_query_without_filter:
        - fact_data_engineer_duplicate_confirmed
        - fact_deans_office_report_method

evaluation:
  invariants:
    - single_source_of_truth_freshness
    - no_duplicate_active_records
  known_mechanisms:
    - refresh_view_on_write_or_shorter_interval
    - close_out_old_record_on_transfer
    - filter_by_active_flag_in_aggregation
    - unique_constraint_on_active_enrollment
    - real_time_or_near_real_time_sync
  tests:
    - id: identifies_correct_root_cause
      description: "Solution identifies both the staleness issue AND the duplicate-row issue"
      check: identifies_root_cause
      params:
        accepted_root_cause_ids: [stale_materialized_view_plus_duplicate_transfer_records]
      required: true
    - id: fixes_staleness
      description: "Solution addresses dashboard staleness (refresh frequency or real-time sync)"
      check: requires_any_mechanism
      params:
        any_of:
          - refresh_view_on_write_or_shorter_interval
          - real_time_or_near_real_time_sync
      required: true
    - id: fixes_duplicate_counting
      description: "Solution addresses the duplicate active-row counting issue, not just staleness"
      check: requires_any_mechanism
      params:
        any_of:
          - close_out_old_record_on_transfer
          - filter_by_active_flag_in_aggregation
          - unique_constraint_on_active_enrollment
      required: true

solution_schema:
  - root_cause
  - explanation
  - proposed_solution
  - implementation
